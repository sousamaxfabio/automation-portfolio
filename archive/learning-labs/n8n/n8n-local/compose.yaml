name: n8n-local

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: "Atlantic/Canary"
      TZ: "Atlantic/Canary"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    name: n8n-local_n8n_data