name: Python and Docker CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: python-automations/day-26-project3-part2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-automations/day-26-project3-part2/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Verify Docker image builds
        run: docker build -t project3-classifier:ci .