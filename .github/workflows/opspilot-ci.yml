name: OpsPilot AI CI

on:
  push:
    paths:
      - "project-4-opspilot-ai/**"
      - ".github/workflows/opspilot-ci.yml"
  pull_request:
    paths:
      - "project-4-opspilot-ai/**"
      - ".github/workflows/opspilot-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: project-4-opspilot-ai

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-4-opspilot-ai/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Validate Docker Compose
        env:
          OPENAI_API_KEY: ci-placeholder-key
          N8N_ENCRYPTION_KEY: ci-placeholder-encryption-key
        run: docker compose config --quiet

      - name: Verify Docker image builds
        run: docker build -t opspilot-ai:ci .