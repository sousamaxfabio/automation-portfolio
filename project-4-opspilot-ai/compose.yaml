name: opspilot-ai

services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - opspilot

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.8
    restart: unless-stopped
    depends_on:
      ai-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}"
      GENERIC_TIMEZONE: "Atlantic/Canary"
      TZ: "Atlantic/Canary"
      WEBHOOK_URL: "http://localhost:5679/"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - opspilot

volumes:
  n8n_data:
    name: opspilot_n8n_data

networks:
  opspilot:
    name: opspilot_network